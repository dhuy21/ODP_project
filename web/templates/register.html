<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - IaaS Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dark_style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .register-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(123, 47, 247, 0.1) 0%, transparent 70%);
            animation: pulseReverse 15s ease-in-out infinite;
        }
        
        @keyframes pulseReverse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(-180deg); }
        }
        
        .register-box {
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px var(--shadow);
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .register-header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        
        .register-header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        .brand-logo {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: rotate 4s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: var(--bg-hover);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .strength-weak { width: 33%; background: var(--danger); }
        .strength-medium { width: 66%; background: var(--warning); }
        .strength-strong { width: 100%; background: var(--success); }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <div class="register-header">
                <div class="brand-logo">✨</div>
                <h1>Create Account</h1>
                <p>Join our infrastructure platform</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">👤 Username</label>
                    <input type="text" id="username" name="username" required 
                           placeholder="Choose a username" autofocus
                           pattern="[a-zA-Z0-9_]{3,20}"
                           title="3-20 characters, letters, numbers, and underscore only">
                    <small style="color:var(--text-secondary); display:block; margin-top:0.5rem;">
                        3-20 characters, letters, numbers, and underscore
                    </small>
                </div>
                
                <div class="form-group">
                    <label for="email">📧 Email</label>
                    <input type="email" id="email" name="email" required 
                           placeholder="your.email@example.com">
                </div>
                
                <div class="form-group">
                    <label for="password">🔒 Password</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="Create a strong password"
                           minlength="8">
                    <div class="password-strength">
                        <div id="strengthBar" class="password-strength-bar"></div>
                    </div>
                    <small style="color:var(--text-secondary); display:block; margin-top:0.5rem;">
                        At least 8 characters
                    </small>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">🔒 Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required 
                           placeholder="Confirm your password">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1.5rem;">
                    ✨ Create Account
                </button>
            </form>
            
            <div id="result"></div>
            
            <div class="login-footer" style="text-align:center; margin-top:2rem; padding-top:2rem; border-top:1px solid var(--border);">
                <p style="color:var(--text-secondary); margin-bottom:0.5rem;">
                    Already have an account?
                </p>
                <a href="{{ url_for('login') }}" style="color:var(--accent-primary); text-decoration:none; font-weight:600;">
                    Sign in instead →
                </a>
            </div>
        </div>
    </div>
    
    <script>
        // Password strength indicator
        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            const bar = document.getElementById('strengthBar');
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            bar.className = 'password-strength-bar';
            if (strength === 1 || strength === 2) {
                bar.classList.add('strength-weak');
            } else if (strength === 3) {
                bar.classList.add('strength-medium');
            } else if (strength >= 4) {
                bar.classList.add('strength-strong');
            }
        });
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const resultDiv = document.getElementById('result');
            const submitBtn = form.querySelector('button[type="submit"]');
            
            // Validate password match
            if (form.password.value !== form.confirm_password.value) {
                resultDiv.innerHTML = '<div class="alert error">❌ Passwords do not match</div>';
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Creating account...';
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: form.username.value,
                        email: form.email.value,
                        password: form.password.value
                    })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    resultDiv.innerHTML = '<div class="alert success">✅ Account created! Redirecting to login...</div>';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    resultDiv.innerHTML = `<div class="alert error">❌ ${result.message}</div>`;
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '✨ Create Account';
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert error">❌ ${error.message}</div>`;
                submitBtn.disabled = false;
                submitBtn.innerHTML = '✨ Create Account';
            }
        });
    </script>
</body>
</html>
