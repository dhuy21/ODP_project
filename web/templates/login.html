<!DOCTYPE html>
<html>
<head>
    <title>Login - IaaS Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .auth-container h1 {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-links {
            text-align: center;
            margin-top: 1rem;
        }
        .auth-links a {
            color: #4299e1;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter your password">
            </div>
            
            <button type="submit">Login</button>
        </form>
        
        <div class="auth-links">
            Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
        </div>
        
        <div id="result"></div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const resultDiv = document.getElementById('result');
            
            const data = {
                username: form.username.value,
                password: form.password.value
            };
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    resultDiv.innerHTML = '<div class="alert success">Login successful! Redirecting...</div>';
                    window.location.href = '/dashboard';
                } else {
                    resultDiv.innerHTML = `<div class="alert error">${result.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert error">${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
