services:
  postgres:
    image: postgres:16
    container_name: odp-postgres
    environment:
      POSTGRES_USER: odp
      POSTGRES_PASSWORD: odp
      POSTGRES_DB: odp_platform
    ports:
      - "5432:5432"
    volumes:
      - odp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odp -d odp_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odp-pgdata:
