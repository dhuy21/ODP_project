---
- name: Configure client nodes
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name: "{{ packages.split(',') }}"
        state: present
      when: packages is defined and packages|length > 0

    - name: Echo hostname to a file
      shell: echo "$(hostname) configured on $(date)" > /root/setup_complete.txt