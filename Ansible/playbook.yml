---
- name: Install packages on client nodes
  hosts: all
  become: yes
  gather_facts: no

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: packages is defined

    - name: Install required packages
      apt:
        name: "{{ packages.split(',') }}"
        state: present
      when: packages is defined
